[package]
name = "emed-code"
version = "0.1.0"
edition = "2024"

[features]
# Gates tests that hit a real local Ollama instance — never enabled in
# CI or a plain `cargo test`. Run via `cargo test --features local`
# (or `just test`).
local = []

[dependencies]
ratatui = "0.30.2"
ureq = { version = "3.3.0", features = ["json"] }
getfrompass = "0.2.1"
zeroize = "1.9.0"
clap = { version = "4.6.4", features = ["derive"] }
unicode-width = "0.2.2"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
